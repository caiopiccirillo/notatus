[package]
name = "notatus-ui"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["gpui-ui"]
gpui-ui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:gpui-kit-assets", "dep:image"]

[dependencies]
notatus-core.workspace = true
notatus-export.workspace = true
notatus-storage.workspace = true
notatus-telemetry.workspace = true
tracing.workspace = true
# GPUI is published by the gpui-kit project as a `gpui-pre-*` snapshot family.
# These versions must match the exact pin used by gpui-component.
gpui = { package = "gpui-pre", version = "=0.3.12", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"], optional = true }
gpui-component = { version = "0.9.1", optional = true }
gpui-kit-assets = { version = "0.9.1", optional = true }
image = { version = "0.25.10", optional = true }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12", features = ["test-support"] }
gpui-component = { version = "0.9.1", features = ["test-support"] }
tempfile.workspace = true
