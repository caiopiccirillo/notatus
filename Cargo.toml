[workspace]
members = [
    "crates/notatus-core",
    "crates/notatus-storage",
    "crates/notatus-export",
    "crates/notatus-infer",
    "crates/notatus-telemetry",
    "crates/notatus-ui",
]
resolver = "2"

[workspace.package]
authors = ["Caio Piccirillo"]
edition = "2024"
license = "MIT"
rust-version = "1.96.0"

[workspace.dependencies]
notatus-core = { path = "crates/notatus-core" }
notatus-storage = { path = "crates/notatus-storage" }
notatus-export = { path = "crates/notatus-export" }
notatus-telemetry = { path = "crates/notatus-telemetry" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "serde-well-known"] }
uuid = { version = "1.29.2", features = ["fast-rng", "serde", "v7"] }
tempfile = "3.27.0"

# OpenTelemetry / observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["http-proto"] }
